services:
  - type: web
    name: global-trends-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: CACHE_TTL_SECONDS
        value: 240
      - key: CORS_ORIGINS
        value: "*"
